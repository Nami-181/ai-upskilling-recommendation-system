name: PR automation

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Label by area (frontend / backend / ai-engine / testing / docs)
        uses: actions/labeler@v5
        with:
          sync-labels: true
      - name: Assign the PR to its author
        uses: toshimaru/auto-author-assign@v2.1.1
      - name: Check the PR links a backlog issue
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            if (!/(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?)\s+#\d+/i.test(body)) {
              core.warning('Link the backlog item this PR delivers, e.g. "Closes #12".');
            }
