# Render Blueprint: New → Blueprint → pick this repo. Creates PostgreSQL + the FastAPI service.
databases:
  - name: lumora-db
    plan: free
    databaseName: lumora
    user: lumora

services:
  - type: web
    name: lumora-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase: { name: lumora-db, property: connectionString }
      - key: SECRET_KEY
        generateValue: true
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: DEMO_MODE
        value: "true"
      - key: CORS_ORIGINS
        value: https://lumora.vercel.app   # replace with your Vercel URL (*.vercel.app is also allowed)
      - key: FRONTEND_URL
        value: https://lumora.vercel.app
      - key: FIRST_ADMIN_PASSWORD
        sync: false   # set a strong admin password in the Render dashboard
